# =============================================================
#  晚夜工作室官网 —— Nginx / 宝塔 伪静态规则
# -------------------------------------------------------------
#  粘贴位置：宝塔面板 → 网站 → 站点设置 → 伪静态
#            （粘贴后点「保存」，宝塔会自动 nginx -t 并重载）
#  等价文件：本项目根目录的 .htaccess 只对 Apache 生效，Nginx 会直接忽略
#  重要：本文件内容会被 include 到 server{} 块内部，
#        因此里面不要再写 http{} / server{} / location 之外的作用域
# =============================================================

# 1. 禁止目录列表（Nginx 默认即为 off，写上以防被全局配置覆盖）
autoindex off;

# 1.1 自定义错误页（部署在子目录时，请把路径改为 /子目录名/404.php）
#     贴到宝塔「伪静态」框即可，error_page 在 server 块内是合法指令
error_page 404 /404.php;
error_page 403 /403.php;

# 2. 隐藏 URL 中的 index.php
#    /index.php                ->  /
#    /article/index.php?id=1   ->  /article/?id=1   （查询参数自动保留）
#    说明：项目前台链接本就是 /article/?id=1 形式，此规则只兜底被人手输 URL 的情况
if ($request_uri ~* "index\.php") {
    rewrite ^/(.*?)index\.php$ /$1 permanent;
}

# 3. 目录访问自动补 index.php
#    保证 /news/  ->  /news/index.php
#          /article/?id=1  ->  /article/index.php?id=1
#    若宝塔「默认文档」里已包含 index.php，这条不会生效，留着无害
if (-d $request_filename) {
    rewrite ^/(.+)/$ /$1/index.php last;
}

# 4. 禁止通过 HTTP 直接读取敏感目录
#    includes/ 里有数据库账号密码，data/ 里是文章正文源文件
location ^~ /includes/ {
    deny all;
}

location ^~ /data/ {
    deny all;
}

# 5. 可选：安全响应头
#    nosniff 建议先确认 CSS 的 Content-Type 为 text/css 后再开启，
#    否则会放大「样式失效」问题
add_header X-Frame-Options "SAMEORIGIN" always;
# add_header X-Content-Type-Options "nosniff" always;

# 6. 可选：安装完成后彻底关闭安装入口
# location ^~ /install/ {
#     deny all;
# }
